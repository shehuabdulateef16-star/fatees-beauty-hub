<script>
const API = "https://fatees-beauty-backend.onrender.com";

let adminKey = "";
let allBookings = [];

const loginSection = document.getElementById("login");
const dashboard = document.getElementById("dashboard");
const message = document.getElementById("message");
const table = document.getElementById("bookings");
const filter = document.getElementById("filter");

async function apiFetch(path, options = {}) {
  const response = await fetch(API + path, {
    ...options,
    headers: {
      ...(options.headers || {}),
      "X-Admin-Key": adminKey
    }
  });

  const data = await response.json().catch(() => ({}));

  if (!response.ok) {
    throw new Error(data.message || "Request failed: " + response.status);
  }

  return data;
}

function statusOf(booking) {
  return String(booking.status || "pending").toLowerCase();
}

document.getElementById("loginForm").addEventListener("submit", async event => {
  event.preventDefault();

  adminKey = document.getElementById("password").value.trim();

  if (!adminKey) {
    message.textContent = "Enter your admin key.";
    return;
  }

  try {
    await loadBookings();

    if (allBookings === null) {
      return;
    }

    loginSection.classList.add("hidden");
    dashboard.classList.remove("hidden");
    document.getElementById("password").value = "";
  } catch (error) {
    message.textContent = "Login failed: " + error.message;
    adminKey = "";
  }
});

async function loadBookings() {
  message.textContent = "Loading bookings...";

  const data = await apiFetch("/bookings");

  allBookings = Array.isArray(data) ? data : [];

  document.getElementById("total").textContent = allBookings.length;
  document.getElementById("pending").textContent =
    allBookings.filter(b => statusOf(b) === "pending").length;
  document.getElementById("confirmed").textContent =
    allBookings.filter(b => statusOf(b) === "confirmed").length;
  document.getElementById("completed").textContent =
    allBookings.filter(b => statusOf(b) === "completed").length;

  renderBookings();
  message.textContent = "Bookings loaded successfully.";
}

function renderBookings() {
  const selected = filter.value;

  const visible = allBookings.filter(b =>
    selected === "all" || statusOf(b) === selected
  );

  table.replaceChildren();

  if (!visible.length) {
    const row = document.createElement("tr");
    const cell = document.createElement("td");
    cell.colSpan = 9;
    cell.textContent = "No bookings found.";
    row.appendChild(cell);
    table.appendChild(row);
    return;
  }

  visible.forEach(booking => {
    const row = document.createElement("tr");

    const values = [
      booking.full_name,
      booking.phone,
      booking.email,
      booking.service,
      booking.location,
      booking.appointment_date,
      booking.appointment_time,
      statusOf(booking)
    ];

    values.forEach(value => {
      const cell = document.createElement("td");
      cell.textContent = value || "—";
      row.appendChild(cell);
    });

    const actions = document.createElement("td");

    if (statusOf(booking) === "pending") {
      const confirm = document.createElement("button");
      confirm.textContent = "Confirm";
      confirm.onclick = () => updateBooking(booking.id, "confirmed");

      const cancel = document.createElement("button");
      cancel.textContent = "Cancel";
      cancel.onclick = () => updateBooking(booking.id, "cancelled");

      actions.append(confirm, cancel);
    } else if (statusOf(booking) === "confirmed") {
      const complete = document.createElement("button");
      complete.textContent = "Complete";
      complete.onclick = () => updateBooking(booking.id, "completed");
      actions.appendChild(complete);
    } else {
      actions.textContent = "—";
    }

    row.appendChild(actions);
    table.appendChild(row);
  });
}

async function updateBooking(id, status) {
  try {
    await apiFetch("/update-booking/" + encodeURIComponent(id), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ status })
    });

    await loadBookings();
    message.textContent = "Booking updated successfully.";
  } catch (error) {
    message.textContent = "Update failed: " + error.message;
  }
}

document.getElementById("refresh").addEventListener("click", async () => {
  try {
    await loadBookings();
  } catch (error) {
    message.textContent = "Could not refresh: " + error.message;
  }
});

document.getElementById("logout").addEventListener("click", () => {
  adminKey = "";
  allBookings = [];
  dashboard.classList.add("hidden");
  loginSection.classList.remove("hidden");
  message.textContent = "";
  table.replaceChildren();
});

filter.addEventListener("change", renderBookings);
</script>
